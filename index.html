<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CampusKart | Buy & Sell</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <a class="brand" href="index.html">🎓 CampusKart</a>
      <a href="sell.html" class="btn btn-primary">+ Sell Item</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Buy &amp; sell second-hand stuff on campus</h1>
        <p>Books, cycles, calculators, hostel essentials — all in one place.</p>
        <input id="searchInput" type="search" placeholder="Search items…" />
      </div>
    </section>

    <section class="container">
      <div class="toolbar">
        <div id="categoryChips" class="chips"></div>
        <select id="sortSelect" class="select">
          <option value="new">Newest first</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
        </select>
      </div>

      <p id="resultCount" class="result-count"></p>
      <div id="itemsGrid" class="grid"></div>

      <div id="emptyState" class="empty" hidden>
        <div class="empty-emoji">🛒</div>
        <h3>No items found</h3>
        <p>Try a different search or post your own item.</p>
        <a href="sell.html" class="btn btn-primary">Sell an item</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> CampusKart · Student project</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
